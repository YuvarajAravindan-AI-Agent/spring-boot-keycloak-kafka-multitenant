server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        # Generous on purpose: NAIVE and JOIN_FETCH are slow *by design* here, and a gateway
        # timeout would present the N+1 demonstration as a broken endpoint rather than a slow
        # one — hiding the exact thing the endpoint exists to show.
        response-timeout: 30s
      routes:
        - id: orders
          uri: ${ORDERS_URL:http://localhost:8081}
          predicates:
            - Path=/api/orders/**

        # Test-data generation also lives in orders-service. It needs its own route because
        # Path=/api/orders/** does not match /api/admin/seed -- a gap that is invisible when
        # you test the service directly on its own port and only appears through the gateway.
        - id: orders-admin
          uri: ${ORDERS_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/**
          metadata:
            # Seeding thousands of rows outruns the global timeout on a small host. The write
            # committed anyway, so the caller got a 504 for a request that had succeeded —
            # the worst kind of failure, because retrying it doubles the data.
            response-timeout: 120000
        - id: inventory
          uri: ${INVENTORY_URL:http://localhost:8082}
          predicates:
            - Path=/api/inventory/**
      default-filters:
        # Strip any tenant header a client tried to set on the way in. The tenant is derived
        # from the signed token inside each service; accepting it from the edge would make the
        # whole isolation story a suggestion.
        - RemoveRequestHeader=X-Tenant-Id

  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri is compared against the token's `iss` claim; jwk-set-uri is the address
          # actually dialled to fetch signing keys. They differ inside Docker, where the token
          # says localhost and only the container network can reach Keycloak. Spring Boot adds
          # a JwtIssuerValidator when both are set, so pinning the JWKS does not silently drop
          # issuer checking.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:18180/realms/platform}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:18180/realms/platform/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    dev.yuvaraj.reference: INFO
