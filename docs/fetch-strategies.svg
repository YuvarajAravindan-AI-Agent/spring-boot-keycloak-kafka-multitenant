<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .hdr    { font-size: 21px; font-weight: 700; fill: #0f172a; }
    .hdrsub { font-size: 13.5px; fill: #64748b; }
    .axis   { stroke: #e2e8f0; stroke-width: 1; }
    .axisL  { stroke: #94a3b8; stroke-width: 1.4; }
    .tick   { font-size: 11.5px; fill: #64748b; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
    .xlab   { font-size: 12px; fill: #334155; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
    .panel  { font-size: 14px; font-weight: 650; fill: #0f172a; }
    .note   { font-size: 12px; fill: #475569; }
    .val    { font-size: 11px; fill: #334155; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
    .lgd    { font-size: 12.5px; fill: #334155; }
  </style>

  <rect width="1240" height="640" fill="#ffffff"/>

  <text x="40" y="44" class="hdr">The same 20-row page, as the table grows</text>
  <text x="40" y="66" class="hdrsub">Page size fixed at 20. Only the number of orders in the tenant changes. Median of 5 runs.</text>

  <!-- Legend -->
  <rect x="806" y="30" width="13" height="13" fill="#64748b" rx="2"/>
  <text x="826" y="41" class="lgd">NAIVE</text>
  <rect x="898" y="30" width="13" height="13" fill="#dc2626" rx="2"/>
  <text x="918" y="41" class="lgd">JOIN_FETCH</text>
  <rect x="1024" y="30" width="13" height="13" fill="#0f766e" rx="2"/>
  <text x="1044" y="41" class="lgd">TWO_QUERY</text>

  <!-- ================= Panel 1: rows materialised (log-ish via manual scale) ============ -->
  <text x="40" y="112" class="panel">Rows materialised to return 20</text>
  <text x="40" y="132" class="note">JOIN_FETCH loads the entire table into the persistence context, then discards all but the page.</text>

  <!-- axes -->
  <line x1="120" y1="150" x2="120" y2="330" class="axisL"/>
  <line x1="120" y1="330" x2="600" y2="330" class="axisL"/>

  <!-- gridlines + ticks : scale 40000 -> 170px -->
  <line x1="120" y1="330" x2="600" y2="330" class="axis"/>
  <line x1="120" y1="287" x2="600" y2="287" class="axis"/>
  <line x1="120" y1="245" x2="600" y2="245" class="axis"/>
  <line x1="120" y1="202" x2="600" y2="202" class="axis"/>
  <line x1="120" y1="160" x2="600" y2="160" class="axis"/>
  <text x="112" y="334" class="tick" text-anchor="end">0</text>
  <text x="112" y="291" class="tick" text-anchor="end">10k</text>
  <text x="112" y="249" class="tick" text-anchor="end">20k</text>
  <text x="112" y="206" class="tick" text-anchor="end">30k</text>
  <text x="112" y="164" class="tick" text-anchor="end">40k</text>

  <!-- groups at 250 / 1000 / 4000 -->
  <!-- 250: naive 200, join 2500, two 200 -->
  <rect x="150" y="329" width="22" height="1"  fill="#64748b"/>
  <rect x="176" y="319" width="22" height="11" fill="#dc2626"/>
  <rect x="202" y="329" width="22" height="1"  fill="#0f766e"/>
  <text x="187" y="311" class="val" text-anchor="middle">2,500</text>
  <text x="187" y="352" class="xlab" text-anchor="middle">250</text>

  <!-- 1000: naive 200, join 10000, two 200 -->
  <rect x="310" y="329" width="22" height="1"  fill="#64748b"/>
  <rect x="336" y="287" width="22" height="43" fill="#dc2626"/>
  <rect x="362" y="329" width="22" height="1"  fill="#0f766e"/>
  <text x="347" y="279" class="val" text-anchor="middle">10,000</text>
  <text x="347" y="352" class="xlab" text-anchor="middle">1,000</text>

  <!-- 4000: naive 200, join 40000, two 200 -->
  <rect x="470" y="329" width="22" height="1"   fill="#64748b"/>
  <rect x="496" y="160" width="22" height="170" fill="#dc2626"/>
  <rect x="522" y="329" width="22" height="1"   fill="#0f766e"/>
  <text x="507" y="152" class="val" text-anchor="middle" font-weight="700" fill="#dc2626">40,000</text>
  <text x="507" y="352" class="xlab" text-anchor="middle">4,000</text>

  <text x="360" y="378" class="note" text-anchor="middle">orders in the tenant</text>
  <text x="152" y="186" class="val" fill="#64748b">NAIVE and TWO_QUERY: 200 rows at every table size</text>
  <text x="152" y="203" class="val" fill="#64748b">(the flat slivers on the axis)</text>

  <!-- ================= Panel 2: median latency ============ -->
  <text x="680" y="112" class="panel">Median response time (ms)</text>
  <text x="680" y="132" class="note">TWO_QUERY stays flat. JOIN_FETCH degrades with the size of the table, not the page.</text>

  <line x1="760" y1="150" x2="760" y2="330" class="axisL"/>
  <line x1="760" y1="330" x2="1190" y2="330" class="axisL"/>

  <!-- scale 400ms -> 170px -->
  <line x1="760" y1="330" x2="1190" y2="330" class="axis"/>
  <line x1="760" y1="288" x2="1190" y2="288" class="axis"/>
  <line x1="760" y1="245" x2="1190" y2="245" class="axis"/>
  <line x1="760" y1="203" x2="1190" y2="203" class="axis"/>
  <line x1="760" y1="160" x2="1190" y2="160" class="axis"/>
  <text x="752" y="334" class="tick" text-anchor="end">0</text>
  <text x="752" y="292" class="tick" text-anchor="end">100</text>
  <text x="752" y="249" class="tick" text-anchor="end">200</text>
  <text x="752" y="207" class="tick" text-anchor="end">300</text>
  <text x="752" y="164" class="tick" text-anchor="end">400</text>

  <!-- 250: naive 62, join 67, two 26 -->
  <rect x="790" y="304" width="22" height="26" fill="#64748b"/>
  <rect x="816" y="302" width="22" height="28" fill="#dc2626"/>
  <rect x="842" y="319" width="22" height="11" fill="#0f766e"/>
  <text x="827" y="352" class="xlab" text-anchor="middle">250</text>
  <text x="801" y="298" class="val" text-anchor="middle">62</text>
  <text x="827" y="294" class="val" text-anchor="middle">67</text>
  <text x="853" y="313" class="val" text-anchor="middle">26</text>

  <!-- 1000: naive 65, join 241, two 46 -->
  <rect x="950" y="302" width="22" height="28"  fill="#64748b"/>
  <rect x="976" y="228" width="22" height="102" fill="#dc2626"/>
  <rect x="1002" y="310" width="22" height="20" fill="#0f766e"/>
  <text x="987" y="352" class="xlab" text-anchor="middle">1,000</text>
  <text x="961" y="296" class="val" text-anchor="middle">65</text>
  <text x="987" y="220" class="val" text-anchor="middle">241</text>
  <text x="1013" y="304" class="val" text-anchor="middle">46</text>

  <!-- 4000: naive 40, join 396, two 28 -->
  <rect x="1110" y="313" width="22" height="17"  fill="#64748b"/>
  <rect x="1136" y="162" width="22" height="168" fill="#dc2626"/>
  <rect x="1162" y="318" width="22" height="12"  fill="#0f766e"/>
  <text x="1147" y="352" class="xlab" text-anchor="middle">4,000</text>
  <text x="1121" y="307" class="val" text-anchor="middle">40</text>
  <text x="1147" y="154" class="val" text-anchor="middle" font-weight="700" fill="#dc2626">396</text>
  <text x="1173" y="312" class="val" text-anchor="middle">28</text>

  <text x="975" y="378" class="note" text-anchor="middle">orders in the tenant</text>

  <!-- ================= Bottom: the takeaway ============ -->
  <rect x="40" y="410" width="1150" height="196" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="10"/>

  <text x="66" y="442" class="panel">Why the obvious fix is the dangerous one</text>

  <text x="66" y="474" class="note" font-weight="650" fill="#64748b">NAIVE — lazy collection</text>
  <text x="66" y="494" class="val">22 statements · 200 rows</text>
  <text x="66" y="513" class="note">One SELECT per row in the page. Degrades with network</text>
  <text x="66" y="530" class="note">latency, so it looks fine against a local database and</text>
  <text x="66" y="547" class="note">falls apart one availability zone away.</text>

  <text x="450" y="474" class="note" font-weight="650" fill="#dc2626">JOIN_FETCH — one query</text>
  <text x="450" y="494" class="val">2 statements · 40,000 rows</text>
  <text x="450" y="513" class="note">Passes review. Passes a small-dataset test. Hibernate</text>
  <text x="450" y="530" class="note">cannot LIMIT a joined collection, so it reads the whole</text>
  <text x="450" y="547" class="note">table and paginates in memory (HHH90003004).</text>

  <text x="834" y="474" class="note" font-weight="650" fill="#0f766e">TWO_QUERY — id page, then fetch</text>
  <text x="834" y="494" class="val">3 statements · 200 rows</text>
  <text x="834" y="513" class="note">Page the ids in the database, then fetch the collection</text>
  <text x="834" y="530" class="note">for exactly those ids. Flat on every axis at any table</text>
  <text x="834" y="547" class="note">size. Asserted in CI so it cannot regress.</text>

  <text x="66" y="584" class="note" font-style="italic">Measured by the endpoint itself via Hibernate statistics — every figure above is reproducible with ./bench.sh.</text>
</svg>
